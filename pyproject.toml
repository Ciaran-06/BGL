[project]
name = "bgl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ciaran Gaffney", email = "ciaran.gaffney@icloud.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
bgl = "bgl:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "bgl",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
