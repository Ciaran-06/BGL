[project]
name = "bgl"
version = "0.1.0.dev0"
description = "Backtest Governance Library: logged, budgeted, witnessed backtest runs and a deployment gate"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Ciaran Gaffney", email = "ciaran.gaffney@icloud.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.2",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "allure-pytest>=2.16.2",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
